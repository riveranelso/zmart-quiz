<style>
:root{
  --bg:#FBF8F3; --card:#FFFFFF; --ink:#1B2A3A; --muted:#4A5868;
  --brand:#15294A; --brand-dark:#0D1C35; --sun:#C9A24A; --line:#D9D3C7;
  --sel:#EEF1F7; --err:#B3261E; --ok:#1E6B3A;
}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem}
.sun{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 5px #F2A93B33}
.lang{min-height:48px;padding:8px 18px;border:2px solid var(--brand);background:#fff;color:var(--brand);
  border-radius:999px;font-size:.9rem;font-weight:700;cursor:pointer}
.progress{height:12px;background:#E9E3D8;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--brand);width:0;transition:width .3s}
.step-label{font-size:.8rem;color:var(--muted);margin:6px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
h1{font-size:1.5rem;line-height:1.25;margin:0 0 12px}
h2{font-size:1.25rem;line-height:1.3;margin:0 0 8px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 16px;border:2px solid var(--line);
  border-radius:14px;background:#fff;cursor:pointer;font-size:1rem;text-align:left;width:100%;color:var(--ink)}
.opt input{width:26px;height:26px;accent-color:var(--brand);flex:none;margin:0}
.opt.on{border-color:var(--brand);background:var(--sel)}
label.f{display:block;font-weight:600;margin:16px 0 6px}
input[type=text],input[type=tel],input[type=email],textarea,select{width:100%;font-size:1rem;padding:14px;
  border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit}
input:focus,textarea:focus,select:focus,.opt:focus-within,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
textarea{min-height:130px;resize:vertical}
.sub{margin-top:18px;padding-top:4px}
.money{display:flex;align-items:center;gap:8px}
.money span{font-weight:700;font-size:1.1rem}
.money input{flex:1}
.consent{display:flex;gap:14px;align-items:flex-start;margin-top:20px;padding:14px;border:2px solid var(--line);border-radius:14px}
.consent input{width:28px;height:28px;flex:none;accent-color:var(--brand);margin-top:2px}
.notice{margin-top:16px;padding:14px;background:#FFF6E6;border-left:5px solid var(--sun);border-radius:8px;font-size:.9rem}
.nav{display:flex;gap:12px;margin-top:20px}
.btn{flex:1;min-height:60px;border-radius:14px;font-size:1.05rem;font-weight:700;cursor:pointer;border:2px solid var(--brand)}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-dark)}
.btn.sec{background:#fff;color:var(--brand)}
.btn[disabled]{opacity:.6;cursor:wait}
.err{color:var(--err);font-weight:600;margin-top:12px;min-height:1.2em}
.done{text-align:center}
.done .check{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;font-size:2.4rem;
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px}.done .btn{text-decoration:none;display:inline-block;line-height:56px;padding:0 34px;margin-top:10px}.done .note{font-size:.85rem;opacity:.72;max-width:36em;margin:16px auto 0}
.hide{display:none}
.logo-wrap{display:flex;justify-content:center;margin:4px 0 14px}
.logo-wrap img{width:260px;max-width:80%;height:auto}
.logo-slot{border:2px dashed var(--line);border-radius:12px;padding:10px 16px;color:var(--muted);font-size:.8rem;text-align:center}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="wrap">
  <!-- Logo oficial de Zmart Consumer Rights (incrustado en LOGO_FILE) -->
  <div class="logo-wrap" id="logoWrap"></div>
  <header>
    <div class="brandmark"><span data-t="brand"></span></div>
    <button class="lang" id="langBtn" type="button" aria-label="Change language / Cambiar idioma"></button>
  </header>
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="bar"></div></div>
  <p class="step-label" id="stepLabel"></p>
  <main class="card" id="card" aria-live="polite"></main>
  <div class="nav" id="nav">
    <button class="btn sec" id="back" type="button"></button>
    <button class="btn pri" id="next" type="button"></button>
  </div>
  <p class="err" id="err" role="alert"></p>
</div>

  doneBtn:"Volver a Zmart Consumer Rights",
  doneNote:"La información enviada se utiliza únicamente para evaluar tu solicitud y comunicarnos contigo."
 },
 en:{
  brand:"Solar panel review", lang:"Español", back:"Back", next:"Continue", start:"Start", send:"Send",
  sending:"Sending…", step:(a,b)=>`Step ${a} of ${b}`,
  introT:"Having problems with your solar panels?",
  introP:"Answer a few short questions. It takes about 2 minutes. You don't need to find any documents.",
  pick:"Choose an option to continue.", pickMany:"Choose at least one option.",
  q1:"What were you told about the cost or savings of the system?",

  q1other:"What were you told? (optional)",
  q2:"What problem are you having now?", q2h:"You can choose more than one.",

  q4o:["I contacted the company","I filed a complaint","I contacted the company and filed a complaint","I haven't done anything yet","I'm not sure"],

  q6:"About your monthly costs", q6h:"Approximate amounts are fine. If it doesn't apply, leave it blank.",

  q5:"If you'd like, tell us briefly what happened.", q5h:"This is optional. You can continue without writing anything.",
  cT:"Your contact information", cH:"So we can reach you.",
  name:"Name", phone:"Phone", email:"Email (optional)", zip:"ZIP code", state:"State",
  statePick:"Choose one", pr:"Puerto Rico", fl:"Florida",

  missing:"Please complete: ", badEmail:"Please check the email.", badPhone:"Please check the phone number.", badMoney:"Check the amounts.",
  needConsent:"Check the authorization box to send.",

};

let lang = "es";
// Answers stored as option indexes so switching language keeps them.
const A = {q1:null,q1other:"",q2:[],q3:null,q3b:null,q4:null,q4b:"",m1:"",m2:"",m3:"",q5:"",
  name:"",phone:"",email:"",zip:"",state:"",consent:false,hp:""};
let step = 0, sending = false, submissionId = null, frozen = null;

const steps = () => {
  const s = ["intro","q1","q2","q3"];
  if (A.q3 === 0) s.push("q3b");
  s.push("q4","q6","q5","contact","done");
  return s;
};
const t = k => T[lang][k];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function optList(key, opts, multi){
  return `<div class="opts" role="${multi?"group":"radiogroup"}">` + opts.map((o,i)=>{
    const on = multi ? A[key].includes(i) : A[key]===i;
    return `<label class="opt ${on?"on":""}"><input type="${multi?"checkbox":"radio"}" name="${key}" value="${i}" ${on?"checked":""}
      onchange="pick('${key}',${i},${multi})"><span>${esc(o)}</span></label>`;
  }).join("") + `</div>`;
}
function pick(key,i,multi){
  if (multi){ const a=A[key]; const p=a.indexOf(i); p<0?a.push(i):a.splice(p,1); }
  else A[key]=i;
  if (key==="q3" && i!==0) A.q3b=null;
  if (key==="q4" && !(i===1||i===2)) A.q4b="";
  $("err").textContent=""; render(false);
}
function bind(id,key){ const el=$(id); if(el) el.addEventListener("input",e=>{A[key]=e.target.type==="checkbox"?e.target.checked:e.target.value;}); }

function render(focus=true){
  const S = steps(), cur = S[step], total = S.length-2; // exclude intro & done
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("langBtn").textContent = t("lang");
  const pct = cur==="done"?100:Math.round((step/(S.length-1))*100);
  $("bar").style.width = pct+"%";
  document.querySelector(".progress").setAttribute("aria-valuenow",pct);
  $("stepLabel").textContent = (cur==="intro"||cur==="done") ? "" : t("step")(step,total);
  $("back").textContent=t("back");
  $("next").textContent = cur==="intro"?t("start"):cur==="contact"?(sending?t("sending"):t("send")):t("next");
  $("back").classList.toggle("hide", cur==="intro");
  $("nav").classList.toggle("hide", cur==="done");
  $("next").disabled = sending;
  $("back").disabled = sending || !!frozen;
  $("langBtn").disabled = !!frozen;
  let h="";
  switch(cur){
   case "intro": h=`<h1>${t("introT")}</h1><p>${t("introP")}</p>`; break;
   case "q1": h=`<h2>${t("q1")}</h2>`+optList("q1",t("q1o"))+
      (A.q1===4?`<div class="sub"><label class="f" for="q1other">${t("q1other")}</label><input type="text" id="q1other" value="${esc(A.q1other)}"></div>`:""); break;
   case "q2": h=`<h2>${t("q2")}</h2><p class="hint">${t("q2h")}</p>`+optList("q2",t("q2o"),true); break;
   case "q3": h=`<h2>${t("q3")}</h2>`+optList("q3",t("q3o")); break;
   case "q3b": h=`<h2>${t("q3b")}</h2>`+optList("q3b",t("q3bo")); break;
   case "q4": h=`<h2>${t("q4")}</h2>`+optList("q4",t("q4o"))+
      ((A.q4===1||A.q4===2)?`<div class="sub"><label class="f" for="q4b">${t("q4b")}</label><input type="text" id="q4b" value="${esc(A.q4b)}"></div>`:""); break;
   case "q6": h=`<h2>${t("q6")}</h2><p class="hint">${t("q6h")}</p>
      <label class="f" for="m1">${t("q6a")}</label>
      <div class="money"><span>$</span><input type="text" id="m1" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(A.m1)}"></div>
      <label class="f" for="m2">${t("q6b")}</label>
      <div class="money"><span>$</span><input type="text" id="m2" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(A.m2)}"></div>
      <label class="f" for="m3">${t("q6c")}</label>
      <div class="money"><span>$</span><input type="text" id="m3" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(A.m3)}"></div>`; break;
   case "q5": h=`<h2>${t("q5")}</h2><p class="hint">${t("q5h")}</p><textarea id="q5" aria-label="${esc(t("q5"))}">${esc(A.q5)}</textarea>`; break;
   case "contact": h=`<h2>${t("cT")}</h2><p class="hint">${t("cH")}</p>
      <label class="f" for="name">${t("name")}</label><input type="text" id="name" autocomplete="name" value="${esc(A.name)}">
      <label class="f" for="phone">${t("phone")}</label><input type="tel" id="phone" autocomplete="tel" inputmode="tel" value="${esc(A.phone)}">
      <label class="f" for="email">${t("email")}</label><input type="email" id="email" autocomplete="email" inputmode="email" value="${esc(A.email)}">
      <label class="f" for="zip">${t("zip")}</label><input type="text" id="zip" autocomplete="postal-code" inputmode="numeric" maxlength="10" value="${esc(A.zip)}">
      <label class="f" for="state">${t("state")}</label>
      <select id="state"><option value="">${t("statePick")}</option>
        <option value="PR" ${A.state==="PR"?"selected":""}>${t("pr")}</option>
        <option value="FL" ${A.state==="FL"?"selected":""}>${t("fl")}</option></select>
      <input class="hp" type="text" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="consent"><input type="checkbox" id="consent" ${A.consent?"checked":""}><span>${t("consent")}</span></label>
      <p class="notice">${t("notice")}</p>`; break;
   case "done": {
      const paras=t("doneP").split("\n\n").map(p=>`<p>${p}</p>`).join("");
      h=`<div class="done"><div class="check" aria-hidden="true">✓</div><h1>${t("doneT")}</h1>${paras}<p><a class="btn pri" href="https://zmartconsumer.com">${t("doneBtn")}</a></p><p class="note">${t("doneNote")}</p></div>`;
      break;
    }
  }
  $("card").innerHTML=h;
  bind("q1other","q1other"); bind("q4b","q4b"); bind("q5","q5");
  ["name","phone","email","zip","hp","m1","m2","m3"].forEach(k=>bind(k,k));
  if($("state")) $("state").addEventListener("change",e=>A.state=e.target.value);
  bind("consent","consent");
  if (frozen){
    $("card").querySelectorAll("input,select,textarea").forEach(el=>{ el.disabled=true; });
  }
  if (focus){ const hd=$("card").querySelector("h1,h2"); if(hd){hd.tabIndex=-1;hd.focus();} window.scrollTo(0,0); }
}

function validate(cur){
  if (["q1","q3","q3b","q4"].includes(cur) && A[cur]===null) return t("pick");
  if (cur==="q2" && !A.q2.length) return t("pickMany");
  if (cur==="q6"){
    // Monetary amounts: mandatory when panels are installed (q3==="Sí"),
    // optional otherwise. Filled values must look like a monetary amount.
    const need = A.q3===0;
    const moneyRe = /^\$?\s*[\d,]+(\.\d{1,2})?\s*$/;
    for (const [k,lk] of [["m1","q6a"],["m2","q6b"],["m3","q6c"]]){
      const v = A[k].trim();
      if (!v){ if (need) return t("missing")+t(lk); continue; }
      if (!moneyRe.test(v)) return t("badMoney");
    }
  }
  if (cur==="contact"){
    const miss=[]; if(!A.name.trim())miss.push(t("name")); if(!A.phone.trim())miss.push(t("phone"));
    if(!A.zip.trim())miss.push(t("zip")); if(!A.state)miss.push(t("state"));
    if(miss.length) return t("missing")+miss.join(", ");
    if(A.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.email.trim())) return t("badEmail");
    if(A.phone.replace(/\D/g,"").length<10) return t("badPhone");
    if(!A.consent) return t("needConsent");
  }
  return "";
}

// Email always uses Spanish question labels with the answer text, for a consistent inbox.
function buildPayload(){
  const es=T.es, v=(arr,i)=>i===null?"—":arr[i];
  const p = {
    "_subject": `Nuevo quiz de paneles solares — ${A.name.trim()} (${A.state==="PR"?"Puerto Rico":"Florida"})`,
    "_template":"table", "_captcha":"false",
    ...(CC_EMAIL.trim() ? {"_cc": CC_EMAIL.trim()} : {}),
    "Nombre":A.name.trim(), "Teléfono":A.phone.trim(), "Email del usuario":A.email.trim()||"(no indicó)",
    ...(A.email.trim() ? {"_replyto": A.email.trim()} : {}),
    "Código postal":A.zip.trim(), "Estado":A.state==="PR"?"Puerto Rico":"Florida",
    [es.q1]: v(es.q1o,A.q1) + (A.q1===4 && A.q1other.trim() ? ` — ${A.q1other.trim()}` : ""),
    [es.q2]: A.q2.slice().sort((a,b)=>a-b).map(i=>es.q2o[i]).join("; "),
    [es.q3]: v(es.q3o,A.q3),
  };
  if (A.q3===0) p[es.q3b]=v(es.q3bo,A.q3b);
  p[es.q4]=v(es.q4o,A.q4);
  if (A.q4===1||A.q4===2) p["¿Ante qué agencia?"]=A.q4b.trim()||"(no indicó)";
  // v0.4 monetary amounts: Spanish labels (contract canonicals luz_antes /
  // luz_ahora / pago_sistema). Blank amounts are omitted from the payload.
  if (A.m1.trim()) p[es.q6a]=A.m1.trim();
  if (A.m2.trim()) p[es.q6b]=A.m2.trim();
  if (A.m3.trim()) p[es.q6c]=A.m3.trim();
  p["Descripción (opcional)"]=A.q5.trim()||"(no escribió)";
  p["Consentimiento de contacto"]="Sí — autorizó comunicación por teléfono o email";
  p["Idioma usado"]=lang==="es"?"Español":"English";
  return p;
}

// Primero se confirma la captura durable en Zmart Owned Intake.
// Solo después de recibir 200/201 se continúa con el POST nativo a FormSubmit.
async function captureToFly(entries){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 10000);
  try {
    const res = await fetch(CAPTURE_URL, {
      method:"POST",
      body:new URLSearchParams(entries),
      credentials:"omit",
      signal:controller.signal
    });
    return res.status===200 || res.status===201;
  } catch (_) {
    return false;
  } finally {
    clearTimeout(timer);
  }
}

async function submit(){
  const target = DESTINATION_EMAIL.trim();
  if (!/^[^\s@\[\]]+@[^\s@\[\]]+\.[^\s@\[\]]+$/.test(target)){ $("err").textContent=t("cfg"); return false; }
  if (!/^https?:$/.test(location.protocol)){ $("err").textContent=t("needServer"); return false; }
  if (A.hp){ return false; } // trampa para bots: no envía nada
  if (sending){ return false; }

  if (!frozen){
    submissionId = crypto.randomUUID();
    const back=new URL(location.href);
    back.search=""; back.hash=""; back.searchParams.set("enviado","1");
    back.searchParams.set("lang",lang);
    frozen = [
      ["_next", back.toString()],
      ...Object.entries(buildPayload()),
      ["submission_id", submissionId]
    ];
  }

  sending=true;
  $("err").textContent="";
  render(false);

  const captured = await captureToFly(frozen);
  if (!captured){
    sending=false;
    render(false);
    $("err").textContent=t("capFail");
    return false;
  }

  // v1.1: owned thank-you. El lead ya quedo guardado (captureToFly === true).
  // Sin FormSubmit, sin navegacion externa: la notificacion la hace el
  // worker owned async (zmart_notify) post-save.
  sending=false;
  step=steps().length-1; // pantalla "done" existente
  render(false);
  return false;
}

$("next").addEventListener("click", async ()=>{
  const S=steps(), cur=S[step], msg=validate(cur);
  $("err").textContent=msg; if(msg) return;
  if (cur==="contact"){ await submit(); return; }
  step=Math.min(step+1,steps().length-1); render();
});
$("back").addEventListener("click",()=>{ if(frozen) return; $("err").textContent=""; step=Math.max(0,step-1); render(); });
$("langBtn").addEventListener("click",()=>{ if(frozen) return; lang=lang==="es"?"en":"es"; $("err").textContent=""; render(false); });
// Regreso desde FormSubmit tras procesar el envío.
(function(){ const q=new URLSearchParams(location.search);
  if(q.get("lang")==="en") lang="en";
  if(q.get("enviado")==="1"){ step=steps().length-1; history.replaceState(null,"",location.pathname); } })();
render(false);
// Logo: show the official file if present; otherwise keep the labeled placeholder.
(function(){ const img=new Image(); img.alt="Zmart Consumer Rights"; img.onload=()=>{ $("logoWrap").innerHTML=""; $("logoWrap").appendChild(img); }; img.src=LOGO_FILE; })();
</script>
